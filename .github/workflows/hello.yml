name: Hello

on: push

jobs:
  hello-js:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -v
          node -e "console.log('hello-js')"

  hello-container:
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - run: |
          node -v
          node -e "console.log('hello-container')"
